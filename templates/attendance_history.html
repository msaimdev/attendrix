<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Attendance History</title>

    <link
        rel="stylesheet"
        href="/static/css/theme.css"
    >

    <style>

        html {
            overflow-y: scroll;
            scrollbar-gutter: stable;
        }


        /* =====================================================
           NAVIGATION (shared styles come from theme.css)
        ====================================================== */


        /* =====================================================
           PAGE
        ====================================================== */

        .page {
            width: 100%;

            min-height: 100vh;
        }

        .container {
            width: 100%;

            max-width: 1180px;

            margin: 0 auto;

            padding:
                32px
                24px
                60px;
        }


        /* =====================================================
           HEADER
        ====================================================== */

        .header {
            display: flex;

            align-items: flex-end;

            justify-content: space-between;

            gap: 20px;

            margin-bottom: 28px;
        }

        .header-left h1 {
            margin: 0;

            font-size: 30px;

            font-weight: 700;

            letter-spacing: -0.5px;

            color: #172033;
        }

        .subtitle {
            margin-top: 7px;

            color: #667085;

            font-size: 15px;
        }

        .date-badge {
            background: #ffffff;

            border: 1px solid #e4e9f1;

            border-radius: 10px;

            padding:
                10px
                15px;

            color: #475467;

            font-size: 14px;

            white-space: nowrap;

            box-shadow:
                0 2px 8px
                rgba(16, 24, 40, 0.04);
        }

        .date-badge strong {
            color: #172033;

            font-weight: 600;
        }


        /* =====================================================
           CONTROLS
        ====================================================== */

        .controls {
            width: 100%;

            display: grid;

            grid-template-columns:
                180px
                210px
                minmax(240px, 1fr)
                170px;

            gap: 14px;

            align-items: end;

            background: #ffffff;

            border: 1px solid #e4e9f1;

            border-radius: 14px;

            padding: 18px;

            margin-bottom: 20px;

            box-shadow:
                0 3px 12px
                rgba(16, 24, 40, 0.04);
        }

        .control {
            min-width: 0;

            display: flex;

            flex-direction: column;

            gap: 7px;
        }

        .control label {
            color: #344054;

            font-size: 13px;

            font-weight: 600;
        }

        input,
        select,
        button {
            width: 100%;

            height: 44px;

            padding:
                0
                12px;

            font-family: inherit;

            font-size: 14px;

            border:
                1px solid #d6dce5;

            border-radius: 9px;

            background: #ffffff;

            color: #172033;

            outline: none;
        }

        input::placeholder {
            color: #98a2b3;
        }

        input:focus,
        select:focus {
            border-color: #3976e8;

            box-shadow:
                0 0 0 3px
                rgba(57, 118, 232, 0.12);
        }

        button {
            border:
                1px solid #172033;

            background: #172033;

            color: white;

            font-weight: 600;

            cursor: pointer;

            transition:
                background 0.18s ease,
                opacity 0.18s ease,
                border-color 0.18s ease;
        }

        button:hover {
            background: #26334d;
        }

        button:disabled {
            opacity: 0.6;

            cursor: not-allowed;
        }


        /* =====================================================
           SUMMARY
        ====================================================== */

        .summary {
            display: grid;

            grid-template-columns:
                repeat(3, minmax(0, 1fr));

            gap: 14px;

            width: 100%;

            margin-bottom: 20px;
        }

        .summary-card {
            min-height: 110px;

            display: flex;

            flex-direction: column;

            justify-content: center;

            background: #ffffff;

            border:
                1px solid #e4e9f1;

            border-radius: 14px;

            padding: 20px;

            box-shadow:
                0 3px 12px
                rgba(16, 24, 40, 0.04);
        }

        .summary-label {
            display: block;

            margin-bottom: 8px;

            color: #667085;

            font-size: 14px;

            font-weight: 500;
        }

        .summary-value {
            font-size: 30px;

            line-height: 1;

            font-weight: 700;

            color: #172033;
        }

        .summary-card.late
        .summary-value {
            color: #b54708;
        }


        /* =====================================================
           TABLE CARD
        ====================================================== */

        .table-card {
            width: 100%;

            min-height: 430px;

            background: #ffffff;

            border:
                1px solid #e4e9f1;

            border-radius: 14px;

            overflow: hidden;

            box-shadow:
                0 3px 12px
                rgba(16, 24, 40, 0.04);
        }

        .table-header {
            min-height: 62px;

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding:
                18px
                20px;

            border-bottom:
                1px solid #edf0f5;

            gap: 15px;
        }

        .table-title {
            margin: 0;

            font-size: 16px;

            font-weight: 650;

            color: #172033;
        }

        .student-count {
            color: #667085;

            font-size: 13px;

            white-space: nowrap;
        }

        .table-wrapper {
            width: 100%;

            min-height: 300px;

            overflow-x: auto;

            overflow-y: hidden;
        }

        table {
            width: 100%;

            min-width: 820px;

            border-collapse: collapse;

            table-layout: fixed;
        }

        th {
            background: #f8fafc;

            color: #667085;

            font-size: 12px;

            font-weight: 650;

            text-transform: uppercase;

            letter-spacing: 0.4px;

            padding:
                13px
                20px;

            text-align: left;

            border-bottom:
                1px solid #e9edf3;
        }

        td {
            padding:
                13px
                20px;

            font-size: 14px;

            color: #344054;

            border-bottom:
                1px solid #f0f2f5;

            height: 58px;

            vertical-align: middle;
        }

        tbody tr {
            transition:
                background-color 0.15s ease;
        }

        tbody tr:hover {
            background: #f8faff;
        }

        tbody tr:last-child td {
            border-bottom: none;
        }

        .student-name {
            font-weight: 600;

            color: #172033;
        }


        /* =====================================================
           STATUS BADGES
        ====================================================== */

        .status-badge {
            display: inline-flex;

            align-items: center;

            justify-content: center;

            min-width: 72px;

            padding:
                5px
                9px;

            border-radius: 999px;

            font-size: 12px;

            font-weight: 650;

            line-height: 1;

            white-space: nowrap;
        }

        .status-present {
            color: #087443;

            background: #ecfdf3;

            border:
                1px solid #abefc6;
        }

        .status-late {
            color: #b54708;

            background: #fffaeb;

            border:
                1px solid #fedf89;
        }

        .status-leave {
            color: #6941c6;

            background: #f4f3ff;

            border:
                1px solid #d9d6fe;
        }

        .status-other {
            color: #475467;

            background: #f2f4f7;

            border:
                1px solid #d0d5dd;
        }


        /* =====================================================
           ACTION
        ====================================================== */

        .action-cell {
            text-align: right;
        }

        .delete-button {
            width: auto;

            min-width: 70px;

            height: 34px;

            padding:
                0
                11px;

            border:
                1px solid #f0b8c1;

            border-radius: 8px;

            background: #fff5f6;

            color: #b4233d;

            font-size: 12px;

            font-weight: 650;

            cursor: pointer;

            transition:
                background 0.18s ease,
                border-color 0.18s ease,
                color 0.18s ease;
        }

        .delete-button:hover {
            background: #fee4e7;

            border-color: #e88b98;

            color: #9f1830;
        }

        .delete-button:disabled {
            opacity: 0.55;

            cursor: not-allowed;
        }


        /* =====================================================
           EMPTY MESSAGE
        ====================================================== */

        .empty {
            min-height: 100px;

            display: flex;

            align-items: center;

            justify-content: center;

            padding:
                25px
                20px;

            text-align: center;

            color: #667085;

            font-size: 14px;
        }

        .error {
            color: #c4324b;

            font-weight: 600;
        }


        /* =====================================================
           LOADING
        ====================================================== */

        .loading {
            opacity: 0.65;

            pointer-events: none;
        }


        /* =====================================================
           TOAST
        ====================================================== */

        .toast {
            position: fixed;

            right: 24px;

            bottom: 24px;

            z-index: 1000;

            max-width: 360px;

            padding:
                13px
                16px;

            border-radius: 10px;

            background: #172033;

            color: white;

            font-size: 14px;

            font-weight: 500;

            box-shadow:
                0 10px 30px
                rgba(16, 24, 40, 0.18);

            opacity: 0;

            transform:
                translateY(10px);

            pointer-events: none;

            transition:
                opacity 0.2s ease,
                transform 0.2s ease;
        }

        .toast.show {
            opacity: 1;

            transform:
                translateY(0);
        }

        .toast.error-toast {
            background: #b4233d;
        }


        /* =====================================================
           RESPONSIVE
        ====================================================== */

        @media (max-width: 950px) {

            .controls {
                grid-template-columns:
                    1fr
                    1fr;
            }

            .summary {
                grid-template-columns:
                    1fr
                    1fr
                    1fr;
            }

        }


        @media (max-width: 800px) {

            .container {
                padding:
                    24px
                    16px
                    50px;
            }

            .header {
                align-items: flex-start;

                flex-direction: column;
            }

        }


        @media (max-width: 600px) {

            .header-left h1 {
                font-size: 25px;
            }

            .date-badge {
                width: 100%;
            }

            .controls {
                grid-template-columns: 1fr;

                gap: 12px;
            }

            .summary {
                grid-template-columns: 1fr;
            }

            .summary-card {
                width: 100%;
            }

            .table-card {
                min-height: 400px;
            }

            .table-wrapper {
                min-height: 280px;
            }

            .table-header {
                align-items: flex-start;

                flex-direction: column;
            }

            .toast {
                left: 16px;

                right: 16px;

                bottom: 16px;

                max-width: none;
            }

        }

    </style>

</head>


<body>

<div class="page">


    <!-- =====================================================
         MAIN
    ====================================================== -->

    <main class="container">


        <!-- =====================================================
             NAVIGATION
        ====================================================== -->

        <nav class="navigation">

            <a
                href="/"
                class="nav-link"
            >
                Dashboard
            </a>

            <a
                href="/students/page"
                class="nav-link"
            >
                Students
            </a>

            <a
                href="/attendance"
                class="nav-link"
            >
                Attendance
            </a>

            <a
                href="/attendance/history"
                class="nav-link active"
            >
                History
            </a>

            <a
                href="/attendance/report"
                class="nav-link"
            >
                Reports
            </a>

            <a
                href="/calendar"
                class="nav-link"
            >
                Calendar
            </a>

            <a
                href="/leaves"
                class="nav-link"
            >
                Student Leave
            </a>

            <a
                href="/settings"
                class="nav-link"
            >
                Settings
            </a>

        </nav>


        <!-- =================================================
             HEADER
        ================================================== -->

        <header class="header">

            <div class="header-left">

                <h1>
                    Attendance History
                </h1>

                <div class="subtitle">
                    Review and manage attendance records by
                    date, class, and student.
                </div>

            </div>


            <div class="date-badge">

                Selected:

                <strong id="selected-date">
                    Loading...
                </strong>

            </div>

        </header>


        <!-- =================================================
             CONTROLS
        ================================================== -->

        <section class="controls">


            <div class="control">

                <label for="date-input">
                    Date
                </label>

                <input
                    type="date"
                    id="date-input"
                >

            </div>


            <div class="control">

                <label for="class-filter">
                    Class
                </label>

                <select id="class-filter">

                    <option value="all">
                        All Classes
                    </option>

                </select>

            </div>


            <div class="control">

                <label for="search-input">
                    Search Student
                </label>

                <input
                    type="text"
                    id="search-input"
                    placeholder="Search student by name..."
                    autocomplete="off"
                >

            </div>


            <div class="control">

                <label>
                    &nbsp;
                </label>

                <button
                    id="load-button"
                    type="button"
                >
                    Load Attendance
                </button>

            </div>


        </section>


        <!-- =================================================
             SUMMARY
        ================================================== -->

        <section class="summary">


            <div class="summary-card">

                <span class="summary-label">
                    Total Records
                </span>

                <span
                    class="summary-value"
                    id="total-records"
                >
                    0
                </span>

            </div>


            <div class="summary-card">

                <span class="summary-label">
                    Present
                </span>

                <span
                    class="summary-value"
                    id="total-present"
                >
                    0
                </span>

            </div>


            <div class="summary-card late">

                <span class="summary-label">
                    Late
                </span>

                <span
                    class="summary-value"
                    id="total-late"
                >
                    0
                </span>

            </div>


        </section>


        <!-- =================================================
             TABLE
        ================================================== -->

        <section class="table-card">


            <div class="table-header">

                <h2 class="table-title">
                    Attendance Records
                </h2>

                <span
                    class="student-count"
                    id="student-count"
                >
                    0 records
                </span>

            </div>


            <div class="table-wrapper">

                <table>

                    <colgroup>

                        <col style="width: 23%;">

                        <col style="width: 13%;">

                        <col style="width: 16%;">

                        <col style="width: 14%;">

                        <col style="width: 15%;">

                        <col style="width: 19%;">

                    </colgroup>


                    <thead>

                        <tr>

                            <th>
                                Name
                            </th>

                            <th>
                                Class
                            </th>

                            <th>
                                Date
                            </th>

                            <th>
                                Time
                            </th>

                            <th>
                                Status
                            </th>

                            <th>
                                Action
                            </th>

                        </tr>

                    </thead>


                    <tbody id="attendance-body">
                    </tbody>

                </table>

            </div>


            <div
                class="empty"
                id="empty-message"
            >
            </div>


        </section>


    </main>

</div>


<!-- =====================================================
     TOAST
====================================================== -->

<div
    class="toast"
    id="toast"
    role="status"
    aria-live="polite"
>
</div>


<script>

    /* =====================================================
       STATE
    ====================================================== */

    let attendanceRecords = [];

    let toastTimeout = null;


    /* =====================================================
       DATE
    ====================================================== */

    function getTodayDate() {

        const today =
            new Date();

        const year =
            today.getFullYear();

        const month =
            String(
                today.getMonth() + 1
            ).padStart(
                2,
                "0"
            );

        const day =
            String(
                today.getDate()
            ).padStart(
                2,
                "0"
            );

        return (
            `${year}-${month}-${day}`
        );
    }


    function setDefaultDate() {

        const today =
            getTodayDate();

        document.getElementById(
            "date-input"
        ).value = today;

        document.getElementById(
            "selected-date"
        ).textContent = today;

    }


    /* =====================================================
       TOAST
    ====================================================== */

    function showToast(
        message,
        isError = false
    ) {

        const toast =
            document.getElementById(
                "toast"
            );

        toast.textContent =
            message;

        toast.classList.toggle(
            "error-toast",
            isError
        );

        toast.classList.add(
            "show"
        );

        if (toastTimeout) {
            clearTimeout(
                toastTimeout
            );
        }

        toastTimeout =
            setTimeout(
                function () {

                    toast.classList.remove(
                        "show"
                    );

                },
                2800
            );

    }


    /* =====================================================
       CLASS FILTER
    ====================================================== */

    function populateClassFilter() {

        const classFilter =
            document.getElementById(
                "class-filter"
            );

        const previousValue =
            classFilter.value;

        const classes =
            [
                ...new Set(
                    attendanceRecords.map(
                        record =>
                            record.class
                    )
                )
            ]
                .filter(
                    studentClass =>
                        studentClass
                )
                .sort(
                    function (a, b) {
                        return a.localeCompare(
                            b
                        );
                    }
                );


        classFilter.innerHTML = "";


        const allOption =
            document.createElement(
                "option"
            );

        allOption.value =
            "all";

        allOption.textContent =
            "All Classes";

        classFilter.appendChild(
            allOption
        );


        for (
            const studentClass
            of classes
        ) {

            const option =
                document.createElement(
                    "option"
                );

            option.value =
                studentClass;

            option.textContent =
                studentClass;

            classFilter.appendChild(
                option
            );

        }


        if (
            previousValue !== "all" &&
            classes.includes(
                previousValue
            )
        ) {

            classFilter.value =
                previousValue;

        } else {

            classFilter.value =
                "all";

        }

    }


    /* =====================================================
       STATUS
    ====================================================== */

    function getStatusClass(
        status
    ) {

        const normalized =
            String(
                status || ""
            )
                .trim()
                .toUpperCase();


        if (
            normalized === "PRESENT"
        ) {

            return "status-present";

        }


        if (
            normalized === "LATE"
        ) {

            return "status-late";

        }


        if (
            normalized === "ON_LEAVE" ||
            normalized === "LEAVE"
        ) {

            return "status-leave";

        }


        return "status-other";

    }


    function getStatusLabel(
        status
    ) {

        const normalized =
            String(
                status || ""
            )
                .trim()
                .toUpperCase();


        if (
            normalized === "ON_LEAVE"
        ) {

            return "On Leave";

        }


        if (
            normalized === "PRESENT"
        ) {

            return "Present";

        }


        if (
            normalized === "LATE"
        ) {

            return "Late";

        }


        return status || "Unknown";

    }


    /* =====================================================
       SUMMARY
    ====================================================== */

    function updateSummary(
        filteredRecords
    ) {

        const total =
            filteredRecords.length;


        const present =
            filteredRecords.filter(
                function (record) {

                    return (
                        String(
                            record.status || ""
                        ).toUpperCase() ===
                        "PRESENT"
                    );

                }
            ).length;


        const late =
            filteredRecords.filter(
                function (record) {

                    return (
                        String(
                            record.status || ""
                        ).toUpperCase() ===
                        "LATE"
                    );

                }
            ).length;


        document.getElementById(
            "total-records"
        ).textContent =
            total;


        document.getElementById(
            "total-present"
        ).textContent =
            present;


        document.getElementById(
            "total-late"
        ).textContent =
            late;


        document.getElementById(
            "student-count"
        ).textContent =
            `${total} ${
                total === 1
                    ? "record"
                    : "records"
            }`;

    }


    /* =====================================================
       DISPLAY
    ====================================================== */

    function displayAttendance() {

        const selectedClass =
            document.getElementById(
                "class-filter"
            ).value;


        const searchText =
            document.getElementById(
                "search-input"
            ).value
                .trim()
                .toLowerCase();


        const tableBody =
            document.getElementById(
                "attendance-body"
            );


        const emptyMessage =
            document.getElementById(
                "empty-message"
            );


        const filteredRecords =
            attendanceRecords.filter(
                function (record) {

                    const matchesClass =
                        selectedClass === "all" ||
                        record.class ===
                            selectedClass;


                    const studentName =
                        String(
                            record.student_name || ""
                        )
                            .toLowerCase();


                    const matchesSearch =
                        studentName.includes(
                            searchText
                        );


                    return (
                        matchesClass &&
                        matchesSearch
                    );

                }
            );


        updateSummary(
            filteredRecords
        );


        tableBody.innerHTML = "";


        if (
            filteredRecords.length === 0
        ) {

            emptyMessage.textContent =
                attendanceRecords.length === 0
                    ? "No attendance records found for this date."
                    : "No records match the current filters.";

            return;

        }


        emptyMessage.textContent = "";


        for (
            const record
            of filteredRecords
        ) {

            const row =
                document.createElement(
                    "tr"
                );


            /* -------------------------------------------------
               NAME
            -------------------------------------------------- */

            const nameCell =
                document.createElement(
                    "td"
                );

            nameCell.className =
                "student-name";

            nameCell.textContent =
                record.student_name || "Unknown";


            /* -------------------------------------------------
               CLASS
            -------------------------------------------------- */

            const classCell =
                document.createElement(
                    "td"
                );

            classCell.textContent =
                record.class || "—";


            /* -------------------------------------------------
               DATE
            -------------------------------------------------- */

            const dateCell =
                document.createElement(
                    "td"
                );

            dateCell.textContent =
                record.date || "—";


            /* -------------------------------------------------
               TIME
            -------------------------------------------------- */

            const timeCell =
                document.createElement(
                    "td"
                );

            timeCell.textContent =
                record.time || "—";


            /* -------------------------------------------------
               STATUS
            -------------------------------------------------- */

            const statusCell =
                document.createElement(
                    "td"
                );


            const statusBadge =
                document.createElement(
                    "span"
                );

            statusBadge.className =
                `status-badge ${
                    getStatusClass(
                        record.status
                    )
                }`;

            statusBadge.textContent =
                getStatusLabel(
                    record.status
                );


            statusCell.appendChild(
                statusBadge
            );


            /* -------------------------------------------------
               DELETE ACTION
            -------------------------------------------------- */

            const actionCell =
                document.createElement(
                    "td"
                );

            actionCell.className =
                "action-cell";


            const deleteButton =
                document.createElement(
                    "button"
                );

            deleteButton.type =
                "button";

            deleteButton.className =
                "delete-button";

            deleteButton.textContent =
                "Delete";


            deleteButton.addEventListener(
                "click",
                function () {

                    deleteAttendanceRecord(
                        record,
                        deleteButton
                    );

                }
            );


            actionCell.appendChild(
                deleteButton
            );


            /* -------------------------------------------------
               BUILD ROW
            -------------------------------------------------- */

            row.appendChild(
                nameCell
            );

            row.appendChild(
                classCell
            );

            row.appendChild(
                dateCell
            );

            row.appendChild(
                timeCell
            );

            row.appendChild(
                statusCell
            );

            row.appendChild(
                actionCell
            );


            tableBody.appendChild(
                row
            );

        }

    }


    /* =====================================================
       DELETE ATTENDANCE
    ====================================================== */

    async function deleteAttendanceRecord(
        record,
        button
    ) {

        if (
            !record ||
            record.id === undefined ||
            record.id === null
        ) {

            showToast(
                "This attendance record cannot be deleted.",
                true
            );

            return;

        }


        const studentName =
            record.student_name ||
            "this student";


        const recordDate =
            record.date ||
            "this date";


        const confirmed =
            window.confirm(
                `Delete attendance record for ${studentName} on ${recordDate}?\n\nThis action cannot be undone.`
            );


        if (!confirmed) {
            return;
        }


        button.disabled = true;

        button.textContent =
            "Deleting...";


        try {

            const response =
                await fetch(
                    `/attendance/record/${record.id}`,
                    {
                        method: "DELETE",
                        headers: {
                            "Accept":
                                "application/json",
                                "X-CSRF-Token":
                                "{{ csrf_token }}"
                            }
                    }
                );


            if (!response.ok) {

                let message =
                    "Failed to delete attendance record.";

                try {

                    const data =
                        await response.json();

                    if (
                        data &&
                        data.detail
                    ) {

                        message =
                            data.detail;

                    }

                } catch (
                    ignored
                ) {
                    // Keep default error.
                }


                throw new Error(
                    message
                );

            }


            showToast(
                "Attendance record deleted."
            );


            await loadAttendance(
                false
            );


        } catch (error) {

            button.disabled =
                false;

            button.textContent =
                "Delete";


            showToast(
                error.message ||
                    "Unable to delete attendance record.",
                true
            );

        }

    }


    /* =====================================================
       LOAD ATTENDANCE
    ====================================================== */

    async function loadAttendance(
        showLoadingMessage = true
    ) {

        const date =
            document.getElementById(
                "date-input"
            ).value;


        const emptyMessage =
            document.getElementById(
                "empty-message"
            );


        const tableCard =
            document.querySelector(
                ".table-card"
            );


        const loadButton =
            document.getElementById(
                "load-button"
            );


        if (!date) {

            emptyMessage.textContent =
                "Please select a date.";

            emptyMessage.className =
                "empty error";

            return;

        }


        try {

            if (
                showLoadingMessage
            ) {

                emptyMessage.textContent =
                    "Loading attendance...";

            }


            emptyMessage.className =
                "empty";


            tableCard.classList.add(
                "loading"
            );


            loadButton.disabled =
                true;


            const response =
                await fetch(
                    `/attendance/${date}`,
                    {
                        method: "GET",
                        headers: {
                            "Accept":
                                "application/json"
                        }
                    }
                );


            if (!response.ok) {

                throw new Error(
                    "Failed to load attendance."
                );

            }


            const data =
                await response.json();


            if (
                !Array.isArray(data)
            ) {

                throw new Error(
                    "Invalid attendance data received."
                );

            }


            attendanceRecords =
                data;


            document.getElementById(
                "selected-date"
            ).textContent =
                date;


            populateClassFilter();

            displayAttendance();


        } catch (error) {

            attendanceRecords = [];


            document.getElementById(
                "attendance-body"
            ).innerHTML = "";


            document.getElementById(
                "total-records"
            ).textContent =
                "0";


            document.getElementById(
                "total-present"
            ).textContent =
                "0";


            document.getElementById(
                "total-late"
            ).textContent =
                "0";


            document.getElementById(
                "student-count"
            ).textContent =
                "0 records";


            emptyMessage.textContent =
                error.message ||
                "Unable to load attendance.";


            emptyMessage.className =
                "empty error";

        } finally {

            tableCard.classList.remove(
                "loading"
            );

            loadButton.disabled =
                false;

        }

    }


    /* =====================================================
       EVENTS
    ====================================================== */

    document
        .getElementById(
            "load-button"
        )
        .addEventListener(
            "click",
            function () {

                loadAttendance(
                    true
                );

            }
        );


    document
        .getElementById(
            "class-filter"
        )
        .addEventListener(
            "change",
            displayAttendance
        );


    document
        .getElementById(
            "search-input"
        )
        .addEventListener(
            "input",
            displayAttendance
        );


    document
        .getElementById(
            "date-input"
        )
        .addEventListener(
            "change",
            function () {

                /*
                 * Date changes intentionally do not
                 * trigger an automatic request.
                 *
                 * The admin clicks "Load Attendance"
                 * to explicitly load the selected date.
                 */

                document.getElementById(
                    "selected-date"
                ).textContent =
                    this.value ||
                    "—";

            }
        );


    /* =====================================================
       START
    ====================================================== */

    setDefaultDate();

    loadAttendance(
        true
    );

</script>

</body>

</html>
