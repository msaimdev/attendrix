<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Today's Attendance</title>

    <link
        rel="stylesheet"
        href="/static/css/theme.css"
    >

    <style>

        html {
            overflow-y: scroll;
        }


        /* =====================================================
           NAVIGATION (shared styles come from theme.css;
           this page has no additional nav overrides)
        ====================================================== */


        /* =====================================================
           MAIN CONTAINER
        ====================================================== */

        .container {
            width: 100%;

            max-width: 1180px;

            margin: 0 auto;

            padding:
                32px 24px 50px;
        }


        /* =====================================================
           HEADER
        ====================================================== */

        .header {
            display: flex;

            justify-content: space-between;

            align-items: flex-end;

            gap: 20px;

            margin-bottom: 28px;
        }

        .header-left h1 {
            margin: 0;

            font-size: 30px;

            font-weight: 700;

            letter-spacing: -0.5px;
        }

        .subtitle {
            margin-top: 7px;

            color: #667085;

            font-size: 15px;
        }

        .date-badge {
            background: #ffffff;

            border:
                1px solid #e4e9f1;

            border-radius: 10px;

            padding: 10px 15px;

            color: #475467;

            font-size: 14px;

            white-space: nowrap;

            box-shadow:
                0 2px 8px
                rgba(
                    16,
                    24,
                    40,
                    0.04
                );
        }

        .date-badge strong {
            color: #172033;

            font-weight: 600;
        }


        /* =====================================================
           SUMMARY
        ====================================================== */

        .summary {
            display: grid;

            grid-template-columns:
                minmax(0, 1fr);

            margin-bottom: 20px;
        }

        .summary-card {
            background: #ffffff;

            border:
                1px solid #e4e9f1;

            border-radius: 14px;

            padding: 20px;

            min-height: 112px;

            display: flex;

            flex-direction: column;

            justify-content: center;

            box-shadow:
                0 3px 12px
                rgba(
                    16,
                    24,
                    40,
                    0.04
                );
        }

        .summary-label {
            color: #667085;

            font-size: 14px;

            font-weight: 500;

            margin-bottom: 8px;
        }

        .summary-value {
            font-size: 30px;

            line-height: 1;

            font-weight: 700;
        }

        .summary-value.present {
            color: #087443;
        }


        /* =====================================================
           FILTER BAR
        ====================================================== */

        .controls {
            width: 100%;

            height: 86px;

            min-height: 86px;

            max-height: 86px;

            background: #ffffff;

            border:
                1px solid #e4e9f1;

            border-radius: 14px;

            padding:
                17px 20px;

            margin-bottom: 18px;

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 25px;

            box-shadow:
                0 3px 12px
                rgba(
                    16,
                    24,
                    40,
                    0.04
                );

            overflow: hidden;
        }

        .filter-description {
            flex: 1;

            min-width: 0;

            color: #667085;

            font-size: 14px;

            line-height: 20px;

            white-space: nowrap;

            overflow: hidden;

            text-overflow: ellipsis;
        }

        .class-filter {
            width: 210px;

            min-width: 210px;

            max-width: 210px;

            flex-shrink: 0;
        }

        .class-filter select {
            display: block;

            width: 210px;

            min-width: 210px;

            max-width: 210px;

            height: 44px;

            border:
                1px solid #d6dce5;

            border-radius: 9px;

            background: #ffffff;

            padding:
                0 13px;

            font-size: 14px;

            color: #172033;

            outline: none;

            cursor: pointer;

            transition:
                border-color 0.18s ease,
                box-shadow 0.18s ease;
        }

        .class-filter select:focus {
            border-color: #3976e8;

            box-shadow:
                0 0 0 3px
                rgba(
                    57,
                    118,
                    232,
                    0.12
                );
        }


        /* =====================================================
           TABLE CARD
        ====================================================== */

        .table-card {
            background: #ffffff;

            border:
                1px solid #e4e9f1;

            border-radius: 14px;

            overflow: hidden;

            box-shadow:
                0 3px 12px
                rgba(
                    16,
                    24,
                    40,
                    0.04
                );
        }


        /* =====================================================
           TABLE HEADER
        ====================================================== */

        .table-header {
            height: 60px;

            min-height: 60px;

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding:
                18px 20px;

            border-bottom:
                1px solid #edf0f5;
        }

        .table-title {
            margin: 0;

            font-size: 16px;

            font-weight: 650;
        }

        .table-count {
            color: #667085;

            font-size: 13px;

            white-space: nowrap;
        }


        /* =====================================================
           FIXED TABLE AREA
        ====================================================== */

        .table-wrapper {

            width: 100%;

            /*
             * IMPORTANT:
             *
             * The table now has its own fixed-height
             * viewing area.
             *
             * Filtering therefore changes only the
             * contents INSIDE this box.
             *
             * The page itself does not change height.
             */

            height: 420px;

            min-height: 420px;

            max-height: 420px;

            overflow-y: auto;

            overflow-x: auto;

            /*
             * Prevent the browser from using table
             * rows as scroll anchors.
             */
            overflow-anchor: none;
        }

        table {

            width: 100%;

            border-collapse: collapse;

            table-layout: fixed;

            min-width: 600px;
        }

        thead {

            position: sticky;

            top: 0;

            z-index: 2;
        }

        th {

            height: 45px;

            background: #f8fafc;

            color: #667085;

            font-size: 12px;

            font-weight: 650;

            text-transform: uppercase;

            letter-spacing: 0.4px;

            padding:
                13px 20px;

            text-align: left;

            border-bottom:
                1px solid #e9edf3;
        }

        td {

            height: 58px;

            padding:
                15px 20px;

            font-size: 14px;

            color: #344054;

            border-bottom:
                1px solid #f0f2f5;
        }

        tbody tr {

            transition:
                background-color
                0.15s ease;

            overflow-anchor: none;
        }

        tbody tr:hover {
            background: #f8faff;
        }

        tbody tr:last-child td {
            border-bottom: none;
        }


        /* =====================================================
           TEXT
        ====================================================== */

        .student-name {
            font-weight: 600;

            color: #172033;
        }

        .time {
            color: #667085;

            font-variant-numeric:
                tabular-nums;
        }


        /* =====================================================
           EMPTY / ERROR
        ====================================================== */

        .empty {

            height: 80px;

            min-height: 80px;

            padding:
                25px 20px;

            display: flex;

            align-items: center;

            justify-content: center;

            text-align: center;

            color: #667085;

            font-size: 14px;
        }

        .error {
            color: #c4324b;

            font-weight: 600;
        }


        /* =====================================================
           RESPONSIVE
        ====================================================== */

        @media (max-width: 900px) {

            .nav-container {

                flex-direction: column;

                align-items: stretch;

                padding-top: 10px;

                gap: 5px;
            }

            .brand {
                padding: 5px 0;
            }

            .nav-links {

                height: 50px;

                overflow-x: auto;

                justify-content:
                    flex-start;
            }

            .nav-link {

                height: 50px;

                flex-shrink: 0;
            }
        }


        @media (max-width: 700px) {

            .container {

                padding:
                    24px 16px 40px;
            }

            .header {

                align-items:
                    flex-start;

                flex-direction:
                    column;
            }

            .date-badge {
                width: 100%;
            }

            .controls {

                height: auto;

                min-height: 86px;

                max-height: none;

                padding:
                    16px 18px;

                flex-direction:
                    column;

                align-items:
                    stretch;

                gap: 12px;

                overflow: visible;
            }

            .filter-description {

                width: 100%;

                white-space: normal;
            }

            .class-filter {

                width: 100%;

                min-width: 100%;

                max-width: 100%;
            }

            .class-filter select {

                width: 100%;

                min-width: 100%;

                max-width: 100%;
            }

            .table-wrapper {

                height: 360px;

                min-height: 360px;

                max-height: 360px;
            }
        }


        @media (max-width: 600px) {

            .header-left h1 {
                font-size: 25px;
            }

            th,
            td {

                padding:
                    12px 14px;
            }
        }

    </style>

</head>


<body>


    <!-- =====================================================
         MAIN CONTENT
    ====================================================== -->

    <main class="container">


        <!-- =====================================================
             NAVIGATION
        ====================================================== -->

        <nav class="navigation">

            <a
                href="/"
                class="nav-link"
            >
                Dashboard
            </a>

            <a
                href="/students/page"
                class="nav-link"
            >
                Students
            </a>

            <a
                href="/attendance"
                class="nav-link active"
            >
                Attendance
            </a>

            <a
                href="/attendance/history"
                class="nav-link"
            >
                History
            </a>

            <a
                href="/attendance/report"
                class="nav-link"
            >
                Reports
            </a>

            <a
                href="/calendar"
                class="nav-link"
            >
                Calendar
            </a>

            <a
                href="/leaves"
                class="nav-link"
            >
                Student Leave
            </a>

            <a
                href="/settings"
                class="nav-link"
            >
                Settings
            </a>

        </nav>


        <!-- HEADER -->

        <header class="header">

            <div class="header-left">

                <h1>
                    Today's Attendance
                </h1>

                <div class="subtitle">
                    View students marked present today
                </div>

            </div>


            <div class="date-badge">

                Today:

                <strong id="date">
                    Loading...
                </strong>

            </div>

        </header>


        <!-- SUMMARY -->

        <section class="summary">

            <div class="summary-card">

                <span class="summary-label">
                    Total Present
                </span>

                <span
                    class="summary-value present"
                    id="total-present"
                >
                    0
                </span>

            </div>

        </section>


        <!-- FILTER -->

        <section class="controls">

            <div class="filter-description">
                Filter today's attendance by class
            </div>


            <div class="class-filter">

                <select id="class-filter">

                    <option value="all">
                        All Classes
                    </option>

                </select>

            </div>

        </section>


        <!-- TABLE -->

        <section class="table-card">

            <div class="table-header">

                <h2 class="table-title">
                    Attendance Records
                </h2>


                <span
                    class="table-count"
                    id="table-count"
                >
                    0 students
                </span>

            </div>


            <div class="table-wrapper">

                <table>

                    <thead>

                        <tr>

                            <th>
                                Name
                            </th>

                            <th>
                                Class
                            </th>

                            <th>
                                Time
                            </th>

                        </tr>

                    </thead>


                    <tbody
                        id="attendance-body"
                    >
                    </tbody>

                </table>


                <div
                    class="empty"
                    id="empty-message"
                >
                </div>

            </div>

        </section>


    </main>


<script>


    let attendanceRecords = [];


    /* =====================================================
       DATE
    ====================================================== */

    function updateDate() {

        const today =
            new Date();


        const year =
            today.getFullYear();


        const month =
            String(
                today.getMonth() + 1
            ).padStart(
                2,
                "0"
            );


        const day =
            String(
                today.getDate()
            ).padStart(
                2,
                "0"
            );


        document.getElementById(
            "date"
        ).textContent =
            `${year}-${month}-${day}`;
    }


    /* =====================================================
       CLASS FILTER
    ====================================================== */

    function populateClassFilter(records) {

        const classFilter =
            document.getElementById(
                "class-filter"
            );


        const currentValue =
            classFilter.value;


        const classes =
            [
                ...new Set(
                    records.map(
                        record =>
                            record.class
                    )
                )
            ].sort();


        classFilter.innerHTML =
            "";


        const allOption =
            document.createElement(
                "option"
            );


        allOption.value =
            "all";


        allOption.textContent =
            "All Classes";


        classFilter.appendChild(
            allOption
        );


        for (
            const studentClass
            of classes
        ) {

            const option =
                document.createElement(
                    "option"
                );


            option.value =
                studentClass;


            option.textContent =
                studentClass;


            classFilter.appendChild(
                option
            );
        }


        if (
            currentValue === "all" ||
            classes.includes(
                currentValue
            )
        ) {

            classFilter.value =
                currentValue;

        } else {

            classFilter.value =
                "all";
        }
    }


    /* =====================================================
       DISPLAY ATTENDANCE
    ====================================================== */

    function displayAttendance(records) {

        const selectedClass =
            document.getElementById(
                "class-filter"
            ).value;


        const tableBody =
            document.getElementById(
                "attendance-body"
            );


        const emptyMessage =
            document.getElementById(
                "empty-message"
            );


        let filteredRecords =
            records;


        if (
            selectedClass !== "all"
        ) {

            filteredRecords =
                records.filter(
                    record =>
                        record.class ===
                        selectedClass
                );
        }


        /* SUMMARY */

        document.getElementById(
            "total-present"
        ).textContent =
            filteredRecords.length;


        /* TABLE COUNT */

        const count =
            filteredRecords.length;


        document.getElementById(
            "table-count"
        ).textContent =
            `${count} ${
                count === 1
                    ? "student"
                    : "students"
            }`;


        /* CLEAR TABLE */

        tableBody.innerHTML =
            "";


        /* EMPTY STATE */

        if (
            filteredRecords.length === 0
        ) {

            emptyMessage.textContent =
                "No attendance recorded for this class.";

            return;
        }


        emptyMessage.textContent =
            "";


        /* ROWS */

        for (
            const record
            of filteredRecords
        ) {

            const row =
                document.createElement(
                    "tr"
                );


            const nameCell =
                document.createElement(
                    "td"
                );


            nameCell.className =
                "student-name";


            nameCell.textContent =
                record.student_name;


            const classCell =
                document.createElement(
                    "td"
                );


            classCell.textContent =
                record.class;


            const timeCell =
                document.createElement(
                    "td"
                );


            timeCell.className =
                "time";


            timeCell.textContent =
                record.time;


            row.appendChild(
                nameCell
            );


            row.appendChild(
                classCell
            );


            row.appendChild(
                timeCell
            );


            tableBody.appendChild(
                row
            );
        }
    }


    /* =====================================================
       LOAD ATTENDANCE
    ====================================================== */

    async function loadAttendance() {

        const emptyMessage =
            document.getElementById(
                "empty-message"
            );


        try {

            emptyMessage.textContent =
                "Loading attendance...";


            const response =
                await fetch(
                    "/attendance/today"
                );


            if (
                !response.ok
            ) {

                throw new Error(
                    "Failed to load attendance."
                );
            }


            attendanceRecords =
                await response.json();


            updateDate();


            populateClassFilter(
                attendanceRecords
            );


            displayAttendance(
                attendanceRecords
            );


        } catch (error) {

            document.getElementById(
                "attendance-body"
            ).innerHTML =
                "";


            document.getElementById(
                "total-present"
            ).textContent =
                "0";


            document.getElementById(
                "table-count"
            ).textContent =
                "0 students";


            emptyMessage.textContent =
                "Unable to load attendance.";


            emptyMessage.className =
                "empty error";
        }
    }


    /* =====================================================
       EVENT
    ====================================================== */

    document
        .getElementById(
            "class-filter"
        )
        .addEventListener(
            "change",
            function () {

                /*
                 * No scrollTo().
                 *
                 * No requestAnimationFrame().
                 *
                 * No manual scroll manipulation.
                 *
                 * Filtering only changes the contents
                 * inside the fixed table viewport.
                 */

                displayAttendance(
                    attendanceRecords
                );
            }
        );


    /* =====================================================
       START
    ====================================================== */

    loadAttendance();

</script>


</body>

</html>
