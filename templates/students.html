<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Students</title>

    <link
        rel="stylesheet"
        href="/static/css/theme.css"
    >

    <style>

        html {
            overflow-y: scroll;
        }

        /* =====================================================
           NAVIGATION (shared styles come from theme.css)
        ====================================================== */

        /* =====================================================
           PAGE
        ====================================================== */

        .page {
            min-height: 100vh;
        }

        .container {
            width: 100%;

            max-width: 1180px;

            min-width: 0;

            margin: 0 auto;

            padding: 32px 24px 50px;
        }

        /* =====================================================
           HEADER
        ====================================================== */

        .header {
            width: 100%;

            display: flex;

            justify-content: space-between;

            align-items: flex-end;

            gap: 20px;

            margin-bottom: 28px;
        }

        .header-left {
            min-width: 0;
        }

        .header-left h1 {
            margin: 0;

            font-size: 30px;

            font-weight: 700;

            letter-spacing: -0.5px;

            color: #172033;
        }

        .subtitle {
            margin-top: 7px;

            color: #667085;

            font-size: 15px;
        }

        .date-badge {
            flex-shrink: 0;

            background: #ffffff;

            border: 1px solid #e4e9f1;

            border-radius: 10px;

            padding: 10px 15px;

            color: #475467;

            font-size: 14px;

            white-space: nowrap;

            box-shadow:
                0 2px 8px
                rgba(16, 24, 40, 0.04);
        }

        .date-badge strong {
            color: #172033;

            font-weight: 600;
        }

        /* =====================================================
           SUMMARY
        ====================================================== */

        .summary {
            width: 100%;

            display: grid;

            grid-template-columns:
                repeat(3, minmax(0, 1fr));

            gap: 18px;

            margin-bottom: 26px;
        }

        .summary-card {
            width: 100%;

            min-width: 0;

            background: #ffffff;

            border: 1px solid #e4e9f1;

            border-radius: 14px;

            padding: 20px;

            min-height: 112px;

            display: flex;

            flex-direction: column;

            justify-content: center;

            box-shadow:
                0 3px 12px
                rgba(16, 24, 40, 0.04);

            transition:
                transform 0.18s ease,
                box-shadow 0.18s ease;
        }

        .summary-card:hover {
            transform: translateY(-2px);

            box-shadow:
                0 7px 18px
                rgba(16, 24, 40, 0.07);
        }

        .summary-label {
            color: #667085;

            font-size: 14px;

            font-weight: 500;

            margin-bottom: 8px;
        }

        .summary-value {
            font-size: 30px;

            line-height: 1;

            font-weight: 700;

            color: #172033;
        }

        .summary-value.present {
            color: #087443;
        }

        .summary-value.absent {
            color: #c4324b;
        }

        /* =====================================================
           CONTROLS
        ====================================================== */

        .controls {
            width: 100%;

            min-width: 0;

            display: flex;

            align-items: center;

            gap: 14px;

            background: #ffffff;

            border: 1px solid #e4e9f1;

            border-radius: 14px;

            padding: 17px;

            margin-bottom: 18px;

            box-shadow:
                0 3px 12px
                rgba(16, 24, 40, 0.04);
        }

        .search-wrapper {
            flex: 1 1 auto;

            min-width: 0;

            position: relative;
        }

        .search-wrapper input,
        .class-filter select {
            display: block;

            width: 100%;

            height: 44px;

            border: 1px solid #d6dce5;

            border-radius: 9px;

            background: #ffffff;

            padding: 0 13px;

            font-size: 14px;

            color: #172033;

            outline: none;

            transition:
                border-color 0.18s ease,
                box-shadow 0.18s ease;
        }

        .search-wrapper input::placeholder {
            color: #98a2b3;
        }

        .search-wrapper input:focus,
        .class-filter select:focus {
            border-color: #3976e8;

            box-shadow:
                0 0 0 3px
                rgba(57, 118, 232, 0.12);
        }

        .class-filter {
            flex: 0 0 210px;

            width: 210px;

            min-width: 210px;
        }

        /* =====================================================
           TABLE CARD
        ====================================================== */

        .table-card {
            width: 100%;

            min-width: 0;

            background: #ffffff;

            border: 1px solid #e4e9f1;

            border-radius: 14px;

            overflow: hidden;

            box-shadow:
                0 3px 12px
                rgba(16, 24, 40, 0.04);
        }

        .table-header {
            width: 100%;

            min-height: 58px;

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding: 18px 20px;

            border-bottom:
                1px solid #edf0f5;
        }

        .table-header-left {
            display: flex;

            align-items: center;

            gap: 12px;
        }

        .table-title {
            margin: 0;

            font-size: 16px;

            font-weight: 650;

            color: #172033;
        }

        /* =====================================================
           BUTTONS
        ====================================================== */

        .btn-primary {
            background: #2563eb;

            color: #ffffff;

            border: none;

            border-radius: 8px;

            padding: 10px 16px;

            font-size: 14px;

            font-weight: 600;

            cursor: pointer;

            transition: background 0.15s ease;
        }

        .btn-primary:hover {
            background: #1d4ed8;
        }

        .btn-primary:disabled {
            background: #93b4f5;

            cursor: not-allowed;
        }

        .btn-secondary {
            background: #eef3fa;

            color: #172033;

            border: none;

            border-radius: 8px;

            padding: 10px 16px;

            font-size: 14px;

            font-weight: 600;

            cursor: pointer;

            transition: background 0.15s ease;
        }

        .btn-secondary:hover {
            background: #e2eaf5;
        }

        .btn-danger {
            background: #ffffff;

            color: #dc2626;

            border: 1px solid #fca5a5;

            border-radius: 6px;

            padding: 6px 12px;

            font-size: 13px;

            font-weight: 600;

            cursor: pointer;

            transition: background 0.15s ease;
        }

        .btn-danger:hover {
            background: #fef2f2;
        }

        /* =====================================================
           REGISTRATION MODAL
        ====================================================== */

        .modal-overlay {
            display: none;

            position: fixed;

            inset: 0;

            background: rgba(15, 23, 42, 0.55);

            align-items: center;

            justify-content: center;

            z-index: 1000;
        }

        .modal-overlay.open {
            display: flex;
        }

        .modal-card {
            width: 460px;

            max-width: 92vw;

            max-height: 90vh;

            overflow-y: auto;

            background: #ffffff;

            border-radius: 14px;

            padding: 24px;

            box-shadow:
                0 20px 50px rgba(15, 23, 42, 0.25);
        }

        .modal-title {
            margin: 0 0 16px 0;

            font-size: 18px;

            font-weight: 700;

            color: #172033;
        }

        .modal-field {
            margin-bottom: 14px;
        }

        .modal-field label {
            display: block;

            font-size: 13px;

            font-weight: 600;

            color: #475569;

            margin-bottom: 6px;
        }

        .modal-field input {
            width: 100%;

            padding: 10px 12px;

            border: 1px solid #d7deea;

            border-radius: 8px;

            font-size: 14px;

            box-sizing: border-box;
        }

        .camera-preview-wrapper {
            width: 100%;

            aspect-ratio: 4 / 3;

            background: #0f172a;

            border-radius: 10px;

            overflow: hidden;

            display: flex;

            align-items: center;

            justify-content: center;

            margin-bottom: 14px;
        }

        .camera-preview-wrapper img {
            width: 100%;

            height: 100%;

            object-fit: cover;

            display: none;
        }

        .camera-placeholder-text {
            color: #94a3b8;

            font-size: 13px;
        }

        .capture-progress {
            font-size: 13px;

            font-weight: 600;

            color: #475569;

            margin-bottom: 14px;

            text-align: center;
        }

        .capture-progress.ready {
            color: #16a34a;
        }

        .modal-actions {
            display: flex;

            justify-content: flex-end;

            gap: 10px;

            margin-top: 8px;
        }

        .modal-error {
            color: #dc2626;

            font-size: 13px;

            margin-bottom: 12px;

            display: none;
        }

        .student-count {
            flex-shrink: 0;

            color: #667085;

            font-size: 13px;

            white-space: nowrap;
        }

        /* =====================================================
           STABLE TABLE AREA
        ====================================================== */

        .table-wrapper {
            width: 100%;

            min-width: 0;

            overflow-x: auto;

            /*
             * Keep the table area from collapsing when
             * search results become smaller.
             */
            min-height: 260px;
        }

        table {
            width: 100%;

            min-width: 620px;

            border-collapse: collapse;

            table-layout: fixed;
        }

        th {
            background: #f8fafc;

            color: #667085;

            font-size: 12px;

            font-weight: 650;

            text-transform: uppercase;

            letter-spacing: 0.4px;

            padding: 13px 20px;

            text-align: left;

            border-bottom:
                1px solid #e9edf3;
        }

        /*
         * Fixed column widths prevent horizontal
         * resizing during search/filter operations.
         */

        th:nth-child(1),
        td:nth-child(1) {
            width: 35%;
        }

        th:nth-child(2),
        td:nth-child(2) {
            width: 15%;
        }

        th:nth-child(3),
        td:nth-child(3) {
            width: 25%;
        }

        th:nth-child(4),
        td:nth-child(4) {
            width: 25%;
        }

        td {
            padding: 15px 20px;

            font-size: 14px;

            color: #344054;

            border-bottom:
                1px solid #f0f2f5;

            overflow: hidden;

            text-overflow: ellipsis;

            white-space: nowrap;
        }

        tbody tr {
            transition:
                background-color 0.15s ease;
        }

        tbody tr:hover {
            background: #f8faff;
        }

        tbody tr:last-child td {
            border-bottom: none;
        }

        /* =====================================================
           STUDENT NAME
        ====================================================== */

        .student-name {
            font-weight: 600;

            color: #172033;
        }

        /* =====================================================
           STATUS
        ====================================================== */

        .status-badge {
            display: inline-flex;

            align-items: center;

            gap: 7px;

            padding: 5px 10px;

            border-radius: 999px;

            font-size: 12px;

            font-weight: 600;
        }

        .status-badge::before {
            content: "";

            width: 7px;

            height: 7px;

            border-radius: 50%;
        }

        .status-present {
            color: #087443;

            background: #ecfdf3;
        }

        .status-present::before {
            background: #12b76a;
        }

        .status-absent {
            color: #c4324b;

            background: #fff1f3;
        }

        .status-absent::before {
            background: #f04461;
        }

        /* =====================================================
           EMPTY / ERROR
        ====================================================== */

        .empty {
            width: 100%;

            min-height: 70px;

            padding: 30px 20px;

            text-align: center;

            color: #667085;

            font-size: 14px;
        }

        .error {
            color: #c4324b;

            font-weight: 600;
        }

        /* =====================================================
           RESPONSIVE
        ====================================================== */

        @media (max-width: 800px) {

            .container {
                padding: 24px 16px 40px;
            }

            .header {
                align-items: flex-start;

                flex-direction: column;
            }

            .summary {
                grid-template-columns: 1fr;
            }

            .controls {
                flex-direction: column;

                align-items: stretch;
            }

            .class-filter {
                flex: none;

                width: 100%;

                min-width: 0;
            }

            .table-wrapper {
                min-height: 220px;
            }

        }

        @media (max-width: 600px) {

            .header-left h1 {
                font-size: 25px;
            }

            .date-badge {
                width: 100%;
            }

            .summary-card {
                min-height: 100px;
            }

            th,
            td {
                padding: 12px 14px;
            }

            .table-header {
                padding: 16px;
            }

        }

    </style>

</head>


<body>

<div class="page">


    <!-- =====================================================
         MAIN CONTENT
    ====================================================== -->

    <main class="container">


        <!-- =====================================================
             NAVIGATION
        ====================================================== -->

        <nav class="navigation">

            <a
                href="/"
                class="nav-link"
            >
                Dashboard
            </a>

            <a
                href="/students/page"
                class="nav-link active"
            >
                Students
            </a>

            <a
                href="/attendance"
                class="nav-link"
            >
                Attendance
            </a>

            <a
                href="/attendance/history"
                class="nav-link"
            >
                History
            </a>

            <a
                href="/attendance/report"
                class="nav-link"
            >
                Reports
            </a>

            <a
                href="/calendar"
                class="nav-link"
            >
                Calendar
            </a>

            <a
                href="/leaves"
                class="nav-link"
            >
                Student Leave
            </a>

            <a
                href="/settings"
                class="nav-link"
            >
                Settings
            </a>

        </nav>


        <!-- HEADER -->

        <header class="header">

            <div class="header-left">

                <h1>
                    Students
                </h1>

                <div class="subtitle">
                    Monitor today's attendance status
                </div>

            </div>


            <div class="date-badge">

                Today:

                <strong id="date">
                    Loading...
                </strong>

            </div>

        </header>


        <!-- SUMMARY -->

        <section class="summary">

            <div class="summary-card">

                <span class="summary-label">
                    Total Students
                </span>

                <span
                    class="summary-value"
                    id="total-students"
                >
                    0
                </span>

            </div>


            <div class="summary-card">

                <span class="summary-label">
                    Present
                </span>

                <span
                    class="summary-value present"
                    id="total-present"
                >
                    0
                </span>

            </div>


            <div class="summary-card">

                <span class="summary-label">
                    Absent
                </span>

                <span
                    class="summary-value absent"
                    id="total-absent"
                >
                    0
                </span>

            </div>

        </section>


        <!-- FILTERS -->

        <section class="controls">

            <div class="search-wrapper">

                <input
                    type="text"
                    id="search-input"
                    placeholder="Search student by name..."
                    autocomplete="off"
                >

            </div>


            <div class="class-filter">

                <select id="class-filter">

                    <option value="all">
                        All Classes
                    </option>

                </select>

            </div>

        </section>


        <!-- TABLE -->

        <section class="table-card">

            <div class="table-header">

                <div class="table-header-left">

                    <h2 class="table-title">
                        Students
                    </h2>

                    <span
                        class="student-count"
                        id="student-count"
                    >
                        0 students
                    </span>

                </div>

                <button
                    type="button"
                    class="btn-primary"
                    id="add-student-btn"
                    onclick="openRegisterModal()"
                >
                    + Add Student
                </button>

            </div>


            <div class="table-wrapper">

                <table>

                    <thead>

                        <tr>

                            <th>
                                Name
                            </th>

                            <th>
                                Class
                            </th>

                            <th>
                                Attendance Status
                            </th>

                            <th>
                                Actions
                            </th>

                        </tr>

                    </thead>


                    <tbody
                        id="students-body"
                    >
                    </tbody>

                </table>

            </div>


            <div
                class="empty"
                id="empty-message"
            >
            </div>

        </section>

    </main>

</div>


<!-- ADD STUDENT / REGISTRATION MODAL -->

<div class="modal-overlay" id="register-modal-overlay">

    <div class="modal-card">

        <h3 class="modal-title">
            Add Student
        </h3>

        <div class="modal-error" id="register-error"></div>

        <div class="modal-field">
            <label for="register-name">Student Name</label>
            <input
                type="text"
                id="register-name"
                placeholder="e.g. Emma Khan"
                autocomplete="off"
            >
        </div>

        <div class="modal-field">
            <label for="register-class">Class</label>
            <input
                type="text"
                id="register-class"
                placeholder="e.g. 2-B"
                autocomplete="off"
            >
        </div>

        <div class="camera-preview-wrapper">
            <img id="register-stream-img" alt="Camera preview">
            <span
                class="camera-placeholder-text"
                id="camera-placeholder-text"
            >
                Camera not started
            </span>
        </div>

        <div class="capture-progress" id="capture-progress">
            0 / 10 samples captured
        </div>

        <div class="modal-actions">
            <button
                type="button"
                class="btn-secondary"
                onclick="closeRegisterModal()"
            >
                Cancel
            </button>

            <button
                type="button"
                class="btn-secondary"
                id="start-camera-btn"
                onclick="startCamera()"
            >
                Start Camera
            </button>

            <button
                type="button"
                class="btn-primary"
                id="save-student-btn"
                onclick="saveStudent()"
                disabled
            >
                Save Student
            </button>
        </div>

    </div>

</div>


<script>

    let students = [];

    let attendanceRecords = [];


    /* =====================================================
       DATE
    ====================================================== */

    function updateDate() {

        const today = new Date();

        const year =
            today.getFullYear();

        const month =
            String(today.getMonth() + 1)
                .padStart(2, "0");

        const day =
            String(today.getDate())
                .padStart(2, "0");

        document.getElementById(
            "date"
        ).textContent =
            `${year}-${month}-${day}`;
    }


    /* =====================================================
       PRESENT STUDENTS
    ====================================================== */

    function getPresentStudentIds() {

        return new Set(
            attendanceRecords.map(
                record =>
                    record.student_id
            )
        );
    }


    /* =====================================================
       CLASS FILTER
    ====================================================== */

    function populateClassFilter() {

        const classFilter =
            document.getElementById(
                "class-filter"
            );

        const currentValue =
            classFilter.value;

        const classes =
            [
                ...new Set(
                    students.map(
                        student =>
                            student.class
                    )
                )
            ].sort();


        classFilter.innerHTML = "";


        const allOption =
            document.createElement(
                "option"
            );

        allOption.value = "all";

        allOption.textContent =
            "All Classes";

        classFilter.appendChild(
            allOption
        );


        for (
            const studentClass
            of classes
        ) {

            const option =
                document.createElement(
                    "option"
                );

            option.value =
                studentClass;

            option.textContent =
                studentClass;

            classFilter.appendChild(
                option
            );
        }


        if (
            currentValue === "all" ||
            classes.includes(
                currentValue
            )
        ) {

            classFilter.value =
                currentValue;

        } else {

            classFilter.value =
                "all";
        }
    }


    /* =====================================================
       DISPLAY STUDENTS
    ====================================================== */

    function displayStudents() {

        const searchText =
            document
                .getElementById(
                    "search-input"
                )
                .value
                .trim()
                .toLowerCase();


        const selectedClass =
            document
                .getElementById(
                    "class-filter"
                )
                .value;


        const presentStudentIds =
            getPresentStudentIds();


        const filteredStudents =
            students.filter(
                function (student) {

                    const matchesSearch =
                        student.name
                            .toLowerCase()
                            .includes(
                                searchText
                            );


                    const matchesClass =
                        selectedClass === "all" ||
                        student.class ===
                            selectedClass;


                    return (
                        matchesSearch &&
                        matchesClass
                    );
                }
            );


        const tableBody =
            document.getElementById(
                "students-body"
            );


        const emptyMessage =
            document.getElementById(
                "empty-message"
            );


        tableBody.innerHTML = "";


        document.getElementById(
            "student-count"
        ).textContent =
            `${filteredStudents.length} ${
                filteredStudents.length === 1
                    ? "student"
                    : "students"
            }`;


        if (
            filteredStudents.length === 0
        ) {

            emptyMessage.textContent =
                "No students found.";

            updateSummary();

            return;
        }


        emptyMessage.textContent = "";


        for (
            const student
            of filteredStudents
        ) {

            const row =
                document.createElement(
                    "tr"
                );


            const nameCell =
                document.createElement(
                    "td"
                );

            nameCell.className =
                "student-name";

            nameCell.textContent =
                student.name;


            const classCell =
                document.createElement(
                    "td"
                );

            classCell.textContent =
                student.class;


            const statusCell =
                document.createElement(
                    "td"
                );


            const isPresent =
                presentStudentIds.has(
                    student.student_id
                );


            const badge =
                document.createElement(
                    "span"
                );


            badge.classList.add(
                "status-badge"
            );


            if (isPresent) {

                badge.classList.add(
                    "status-present"
                );

                badge.textContent =
                    "Present";

            } else {

                badge.classList.add(
                    "status-absent"
                );

                badge.textContent =
                    "Absent";
            }


            statusCell.appendChild(
                badge
            );


            const actionsCell =
                document.createElement(
                    "td"
                );

            const deleteBtn =
                document.createElement(
                    "button"
                );

            deleteBtn.className =
                "btn-danger";

            deleteBtn.textContent =
                "Delete";

            deleteBtn.onclick =
                function () {
                    deleteStudent(
                        student.student_id,
                        student.name
                    );
                };

            actionsCell.appendChild(
                deleteBtn
            );


            row.appendChild(
                nameCell
            );

            row.appendChild(
                classCell
            );

            row.appendChild(
                statusCell
            );

            row.appendChild(
                actionsCell
            );


            tableBody.appendChild(
                row
            );
        }


        updateSummary();
    }


    /* =====================================================
       SUMMARY
    ====================================================== */

    function updateSummary() {

        const selectedClass =
            document
                .getElementById(
                    "class-filter"
                )
                .value;


        const presentStudentIds =
            getPresentStudentIds();


        const filteredStudents =
            students.filter(
                function (student) {

                    return (
                        selectedClass ===
                            "all" ||
                        student.class ===
                            selectedClass
                    );
                }
            );


        const total =
            filteredStudents.length;


        const present =
            filteredStudents.filter(
                student =>
                    presentStudentIds.has(
                        student.student_id
                    )
            ).length;


        const absent =
            total - present;


        document.getElementById(
            "total-students"
        ).textContent =
            total;


        document.getElementById(
            "total-present"
        ).textContent =
            present;


        document.getElementById(
            "total-absent"
        ).textContent =
            absent;
    }


    /* =====================================================
       LOAD DATA
    ====================================================== */

    async function loadData() {

        const emptyMessage =
            document.getElementById(
                "empty-message"
            );


        try {

            emptyMessage.textContent =
                "Loading students...";


            const [
                studentsResponse,
                attendanceResponse
            ] =
                await Promise.all([
                    fetch("/students"),
                    fetch("/attendance/today")
                ]);


            if (
                !studentsResponse.ok ||
                !attendanceResponse.ok
            ) {

                throw new Error(
                    "Failed to load data."
                );
            }


            students =
                await studentsResponse.json();


            attendanceRecords =
                await attendanceResponse.json();


            updateDate();

            populateClassFilter();

            displayStudents();


        } catch (error) {

            document.getElementById(
                "students-body"
            ).innerHTML = "";


            emptyMessage.textContent =
                "Unable to load student attendance.";


            emptyMessage.className =
                "empty error";
        }
    }


    /* =====================================================
       EVENTS
    ====================================================== */

    document
        .getElementById(
            "search-input"
        )
        .addEventListener(
            "input",
            displayStudents
        );


    document
        .getElementById(
            "class-filter"
        )
        .addEventListener(
            "change",
            displayStudents
        );


    /* =====================================================
       STUDENT DELETE
    ====================================================== */

    async function deleteStudent(studentId, studentName) {

        const confirmed = window.confirm(
            `Remove ${studentName} from the student list? ` +
            `This cannot be undone from here.`
        );

        if (!confirmed) {
            return;
        }

        try {

            const response = await fetch(
                `/students/${studentId}/delete`,
                {
                     method: "POST",
                     headers: {
                         "X-CSRF-Token":
                             "{{ csrf_token }}"
                     }
                }
            );

            if (!response.ok) {
                throw new Error(
                    "Failed to delete student."
                );
            }

            await loadData();

        } catch (error) {

            alert(
                "Could not delete student: " +
                error.message
            );
        }
    }


    /* =====================================================
       STUDENT REGISTRATION (Add Student modal)
    ====================================================== */

    let registrationPollTimer = null;
    let cameraStarted = false;

    function openRegisterModal() {

        document
            .getElementById("register-name")
            .value = "";

        document
            .getElementById("register-class")
            .value = "";

        document
            .getElementById("register-error")
            .style.display = "none";

        document
            .getElementById("capture-progress")
            .textContent = "0 / 10 samples captured";

        document
            .getElementById("capture-progress")
            .classList.remove("ready");

        document
            .getElementById("save-student-btn")
            .disabled = true;

        document
            .getElementById("start-camera-btn")
            .disabled = false;

        const img = document.getElementById(
            "register-stream-img"
        );
        img.style.display = "none";
        img.src = "";

        document
            .getElementById("camera-placeholder-text")
            .style.display = "block";

        cameraStarted = false;

        document
            .getElementById("register-modal-overlay")
            .classList.add("open");
    }

    async function closeRegisterModal() {

        document
            .getElementById("register-modal-overlay")
            .classList.remove("open");

        stopPolling();

        if (cameraStarted) {

            try {
                await fetch(
                    "/students/register/cancel",
                    {
                       method: "POST",
                       headers: {
                           "X-CSRF-Token":
                               "{{ csrf_token }}"
                        }
                    }
               );
            } catch (error) {
                // Nothing to do — modal is closing anyway.
            }

            cameraStarted = false;
        }
    }

    function showRegisterError(message) {

        const errorBox = document.getElementById(
            "register-error"
        );

        errorBox.textContent = message;
        errorBox.style.display = "block";
    }

    async function startCamera() {

        const name = document
            .getElementById("register-name")
            .value
            .trim();

        const studentClass = document
            .getElementById("register-class")
            .value
            .trim();

        if (!name || !studentClass) {
            showRegisterError(
                "Enter the student's name and class " +
                "before starting the camera."
            );
            return;
        }

        document
            .getElementById("register-error")
            .style.display = "none";

        try {

            const response = await fetch(
                "/students/register/start",
                {
                    method: "POST",
                    headers: {
                        "X-CSRF-Token":
                        "{{ csrf_token }}"
                    }
                }
            );

            if (!response.ok) {
                const body = await response.json();
                throw new Error(
                    body.detail || "Could not start camera."
                );
            }

            cameraStarted = true;

            const img = document.getElementById(
                "register-stream-img"
            );

            img.src =
                "/students/register/stream?t=" +
                Date.now();

            img.style.display = "block";

            document
                .getElementById("camera-placeholder-text")
                .style.display = "none";

            document
                .getElementById("start-camera-btn")
                .disabled = true;

            startPolling();

        } catch (error) {
            showRegisterError(error.message);
        }
    }

    function startPolling() {

        registrationPollTimer = setInterval(
            async function () {

                try {

                    const response = await fetch(
                        "/students/register/status"
                    );

                    const status = await response.json();

                    if (!status.active && !status.ready) {
                        // Camera died mid-session (unplugged,
                        // busy with another process, etc).
                        stopPolling();
                        cameraStarted = false;

                        document
                            .getElementById("start-camera-btn")
                            .disabled = false;

                        const img = document.getElementById(
                            "register-stream-img"
                        );
                        img.style.display = "none";
                        img.src = "";

                        document
                            .getElementById("camera-placeholder-text")
                            .style.display = "block";

                        showRegisterError(
                            "Camera stopped responding. It may " +
                            "be in use by the attendance session " +
                            "or disconnected. Try again in a " +
                            "moment."
                        );

                        return;
                    }

                    const progressEl = document
                        .getElementById("capture-progress");

                    progressEl.textContent =
                        `${status.samples_captured} / ` +
                        `${status.target_samples} samples captured`;

                    if (status.ready) {
                        progressEl.classList.add("ready");
                        document
                            .getElementById("save-student-btn")
                            .disabled = false;
                    }

                } catch (error) {
                    // Transient poll failure — ignore, try again.
                }
            },
            500
        );
    }

    function stopPolling() {

        if (registrationPollTimer !== null) {
            clearInterval(registrationPollTimer);
            registrationPollTimer = null;
        }
    }

    async function saveStudent() {

        const name = document
            .getElementById("register-name")
            .value
            .trim();

        const studentClass = document
            .getElementById("register-class")
            .value
            .trim();

        const formData = new FormData();
        formData.append("name", name);
        formData.append("student_class", studentClass);

        try {

            const response = await fetch(
                "/students/register/save",
                {
                    method: "POST",
                    headers: {
                        "X-CSRF-Token":
                            "{{ csrf_token }}"
                    },
                    body: formData,
                }
            );

            if (!response.ok) {
                const body = await response.json();
                throw new Error(
                    body.detail || "Could not save student."
                );
            }

            stopPolling();
            cameraStarted = false;

            document
                .getElementById("register-modal-overlay")
                .classList.remove("open");

            await loadData();

        } catch (error) {
            showRegisterError(error.message);
        }
    }


    /* =====================================================
       START
    ====================================================== */

    loadData();

</script>
